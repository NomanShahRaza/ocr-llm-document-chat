<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a18"/>
      <stop offset="1" stop-color="#0b0f24"/>
    </linearGradient>
    <linearGradient id="edge1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="edge2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="edge3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e2a4a" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>

  <!-- connecting beam -->
  <path d="M370 170 H830" stroke="url(#flow)" stroke-width="10" filter="url(#soft)" opacity="0.7"/>
  <path d="M370 170 H830" stroke="url(#flow)" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>

  <!-- arrows -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
    <path d="M393 170 H427 M415 158 L427 170 L415 182" stroke="#7dd3fc"/>
    <path d="M773 170 H807 M795 158 L807 170 L795 182" stroke="#a5b4fc"/>
  </g>

  <!-- card 1 -->
  <g transform="translate(40 40)">
    <rect width="330" height="280" rx="22" fill="#0d1428"/>
    <rect width="330" height="280" rx="22" fill="url(#glow1)"/>
    <rect x="1" y="1" width="328" height="278" rx="21" fill="none" stroke="url(#edge1)" stroke-width="2"/>
    <text x="28" y="44" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="3">STEP 01</text>
    <g transform="translate(125 64)" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="40" cy="40" r="40" fill="#0f2140" stroke="none"/>
      <path d="M26 18 H48 L58 28 V62 H26 Z"/>
      <path d="M48 18 V28 H58"/>
      <path d="M42 54 V38 M35 45 L42 38 L49 45"/>
    </g>
    <text x="165" y="186" text-anchor="middle" fill="#f1f5ff" font-size="28" font-weight="700">Drop a file</text>
    <text x="165" y="218" text-anchor="middle" fill="#9fb3d9" font-size="15">PDF, PNG, JPG, TIFF or WebP</text>
    <text x="165" y="242" text-anchor="middle" fill="#9fb3d9" font-size="15">Long multi-page PDFs welcome</text>
  </g>

  <!-- card 2 -->
  <g transform="translate(435 40)">
    <rect width="330" height="280" rx="22" fill="#0d1428"/>
    <rect width="330" height="280" rx="22" fill="url(#glow2)"/>
    <rect x="1" y="1" width="328" height="278" rx="21" fill="none" stroke="url(#edge2)" stroke-width="2"/>
    <text x="28" y="44" fill="#22d3ee" font-size="13" font-weight="700" letter-spacing="3">STEP 02</text>
    <g transform="translate(125 64)" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="40" cy="40" r="40" fill="#0c2638" stroke="none"/>
      <path d="M20 30 V20 H30 M50 20 H60 V30 M60 50 V60 H50 M30 60 H20 V50"/>
      <path d="M30 32 H50 M30 40 H46 M30 48 H42"/>
      <path d="M14 40 H66" stroke="#e0f2fe" stroke-width="2" opacity="0.9"/>
    </g>
    <text x="165" y="186" text-anchor="middle" fill="#f1f5ff" font-size="28" font-weight="700">Read it</text>
    <text x="165" y="218" text-anchor="middle" fill="#9fb3d9" font-size="15">Text, tables, headings and math</text>
    <text x="165" y="242" text-anchor="middle" fill="#9fb3d9" font-size="15">pulled out in reading order</text>
  </g>

  <!-- card 3 -->
  <g transform="translate(830 40)">
    <rect width="330" height="280" rx="22" fill="#0d1428"/>
    <rect width="330" height="280" rx="22" fill="url(#glow3)"/>
    <rect x="1" y="1" width="328" height="278" rx="21" fill="none" stroke="url(#edge3)" stroke-width="2"/>
    <text x="28" y="44" fill="#a78bfa" font-size="13" font-weight="700" letter-spacing="3">STEP 03</text>
    <g transform="translate(125 64)" fill="none" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="40" cy="40" r="40" fill="#1e1640" stroke="none"/>
      <path d="M20 24 H60 V50 H40 L30 60 V50 H20 Z"/>
      <path d="M40 31 L42.5 36 L48 37 L44 41 L45 47 L40 44 L35 47 L36 41 L32 37 L37.5 36 Z" fill="#c4b5fd" stroke="none"/>
    </g>
    <text x="165" y="186" text-anchor="middle" fill="#f1f5ff" font-size="28" font-weight="700">Ask it</text>
    <text x="165" y="218" text-anchor="middle" fill="#9fb3d9" font-size="15">Chat in plain language</text>
    <text x="165" y="242" text-anchor="middle" fill="#9fb3d9" font-size="15">Answers come from your document</text>
  </g>
</svg>
